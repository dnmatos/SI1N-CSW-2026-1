<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>CSS Internal</title>

    <style>
        body {
            background-color: #f0f0f0;
            font-family: Arial;
        }

        h1 {
            color: purple;
            text-align: center;
        }

        p {
            color: black;
            font-size: 18px;
        }

        button {
            background-color: orange;
            color: white;
            padding: 10px;
            border: none;
        }
    </style>

</head>
<body>

    <h1>Página com CSS Internal</h1>

    <p>Esse estilo está dentro da própria página HTML.</p>

    <button>Clique aqui</button>

</body>
</html>
